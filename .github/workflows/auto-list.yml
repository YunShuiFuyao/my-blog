name: 构建站点

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - '!posts/index.json'
      - '!posts/list.json'
      - 'scripts/**'
      - 'templates/**'
      - 'package.json'
      - 'package-lock.json'
      - 'site.config.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成静态页与索引
        run: npm run build

      - name: 提交生成文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/index.json posts/list.json post archive.html tags.html feed.xml sitemap.xml 404.html
          if git diff --cached --quiet; then
            echo "没有需要提交的变化"
            exit 0
          fi
          git commit -m "chore: 构建站点 [skip ci]"
          git push
